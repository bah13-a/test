# Pile PROFIL PRO (données réelles). UN SEUL fichier de configuration : .env (créé par `tools/init-env.py` à partir de .env.example, contrôlé par
# `tools/check-env.py`). Prérequis : certificats dans ./certs. Pour la démonstration sans dépendance : docker-compose.dev.yml (profil dev, mocks).
name: vas-pro
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: "${POSTGRES_DB:-vas}", POSTGRES_USER: "${DB_USER}", POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD requis}", LANG: C.UTF-8, TZ: "${TZ:-Africa/Tunis}" }
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}", "-c", "wal_level=replica"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, retries: 20 }
    restart: unless-stopped
  redis:
    image: redis:7.2.2
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requis}"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.13-management
    environment: { RABBITMQ_DEFAULT_USER: "${RABBIT_USER}", RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD:?RABBIT_PASSWORD requis}" }
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 12 }
    restart: unless-stopped
  jasmin:
    image: jookies/jasmin:0.10
    environment:
      # Jasmin lit ses réglages [section]_option dans l'environnement : ils viennent tous du .env (aucun mot de passe par défaut de l'image)
      REDIS_CLIENT_HOST: redis
      REDIS_CLIENT_PORT: "6379"
      REDIS_CLIENT_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD requis}"
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: "5672"
      AMQP_BROKER_USERNAME: "${RABBIT_USER:?RABBIT_USER requis}"
      AMQP_BROKER_PASSWORD: "${RABBIT_PASSWORD:?RABBIT_PASSWORD requis}"
      JCLI_ADMIN_USERNAME: "${JCLI_USER:-jcliadmin}"
      JCLI_ADMIN_PASSWORD: "${JCLI_PASSWORD_MD5:?JCLI_PASSWORD_MD5 requis (md5 de JCLI_PASSWORD, calculé par tools/init-env.py)}"
      ENABLE_PUBLISH_SUBMIT_SM_RESP: "1"
      TZ: "${TZ:-Africa/Tunis}"
    depends_on: [redis, rabbitmq]
    volumes: [jasminconf:/etc/jasmin/store]
    restart: unless-stopped
    # Ni jcli (8990), ni l'API HTTP (1401), ni le serveur SMPP (2775) ne sont publiés : réseau interne uniquement.
    # Sortie SMPP vers les opérateurs : via VPN IPsec / allowlist IP de l'hôte (hors compose).
  jasmin-provision:
    # Une fois (et à chaque changement de paramètres opérateur) : docker compose run --rm jasmin-provision
    image: alpine:3.20
    profiles: ["provision"]
    env_file: .env
    environment: { APP_URL: "${VAS_PUBLIC_BASE_URL}", JCLI_HOST: jasmin, JCLI_PORT: "8990" }
    volumes: ["./infra:/infra:ro"]
    entrypoint: ["sh", "-c", "apk add --no-cache bash netcat-openbsd >/dev/null && bash /infra/jasmin/provision.sh"]
    depends_on: [jasmin]
  app:
    build: .
    env_file: .env
    # alias AVEC point : Jasmin refuse les noms d'hôte sans point dans l'URL de callback (http://app:8080 est rejeté)
    networks: { default: { aliases: [app.vas.internal] } }
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-pro,json}"
      TZ: "${TZ:-Africa/Tunis}"
    # données de démarrage (plages de numéros, numéros portés, catalogue) : déposer les fichiers dans ./data et y faire référence dans le .env (/data/...)
    volumes: ["./data:/data:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
  proxy:
    # Seul composant exposé : TLS, HSTS, /callbacks et /actuator bloqués depuis l'extérieur
    image: nginx:1.27-alpine
    environment:
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME:-localhost}"
      ADMIN_ALLOWED_CIDRS: "${ADMIN_ALLOWED_CIDRS:-}"
      PROXY_API_RATE: "${PROXY_API_RATE:-30}"
      PROXY_LOGIN_RATE: "${PROXY_LOGIN_RATE:-5}"
      TZ: "${TZ:-Africa/Tunis}"
    volumes:
      - ./infra/proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/proxy/40-admin-allow.sh:/docker-entrypoint.d/40-admin-allow.sh:ro
      - ./certs:/etc/nginx/certs:ro
    ports: ["${HTTPS_PORT:-443}:443", "${HTTP_PORT:-80}:80"]
    depends_on: [app]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    # mot de passe de scraping : PROMETHEUS_PASSWORD du .env (jamais un fichier à part)
    environment: { PROMETHEUS_PASSWORD: "${PROMETHEUS_PASSWORD:?PROMETHEUS_PASSWORD requis}" }
    volumes: ["./infra/prometheus:/etc/prometheus:ro"]
    entrypoint: ["sh", "-c", "printf %s \"$$PROMETHEUS_PASSWORD\" > /tmp/scrape_password && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    env_file: .env
    volumes: ["./infra/prometheus/alertmanager.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        sed -e "s|__EMAIL_TO__|$${ALERT_EMAIL_TO}|g" -e "s|__EMAIL_FROM__|$${ALERT_EMAIL_FROM}|g" -e "s|__SMTP_HOST__|$${ALERT_SMTP_HOST}|g" \
            -e "s|__SMTP_USER__|$${ALERT_SMTP_USER}|g" -e "s|__SMTP_PASSWORD__|$${ALERT_SMTP_PASSWORD}|g" -e "s|__WEBHOOK_URL__|$${ALERT_WEBHOOK_URL:-http://localhost:9/none}|g" \
            /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    restart: unless-stopped
  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/loki.yml
    volumes: ["./infra/loki/loki.yml:/etc/loki/loki.yml:ro", "lokidata:/loki"]
    restart: unless-stopped
  promtail:
    image: grafana/promtail:3.2.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes: ["./infra/loki/promtail.yml:/etc/promtail/promtail.yml:ro", "/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [loki]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?GRAFANA_PASSWORD requis}", GF_USERS_ALLOW_SIGN_UP: "false" }
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    ports: ["${GRAFANA_BIND:-127.0.0.1}:3000:3000"]   # par défaut : accès via VPN d'administration / tunnel SSH uniquement
    restart: unless-stopped
volumes: { pgdata: {}, redisdata: {}, rabbitdata: {}, jasminconf: {}, lokidata: {} }
