name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build & tests (unitaires, intégration H2, simulateur SMPP)
        run: mvn -B verify
      - name: Analyse des dépendances vulnérables
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9 -DskipTests
        continue-on-error: true
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modèle .env.example cohérent (structure, aucun secret)
        run: python3 tools/check-env.py --file .env.example --sample
      - name: Génération d'un .env et validation complète
        run: |
          python3 tools/init-env.py --out /tmp/ci.env
          python3 tools/check-env.py --file /tmp/ci.env --sample
      - name: Docker Compose valide avec ce .env
        run: cp /tmp/ci.env .env && docker compose config -q && docker compose -f docker-compose.yml -f infra/ha/docker-compose.ha.yml config -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm test && npm run build
      - run: cd frontend && npm audit --omit=dev --audit-level=high
        continue-on-error: true
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vas-platform:ci .
  integration:
    # Scénario de bout en bout sur la vraie pile (PostgreSQL, Redis, RabbitMQ, Jasmin 0.10) + simulateur SMSC : docs/14-tests-integration.md
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -DskipTests package
      - run: docker compose -f docker-compose.it.yml up -d && sleep 25
      - name: Provisionner Jasmin (connecteur SMPP vers le simulateur)
        run: |
          echo "127.0.0.1 vasapp.local" | sudo tee -a /etc/hosts
          sudo apt-get install -y netcat-openbsd >/dev/null
          TT_SMSC_HOST=smpp-sim TT_SMSC_PORT=2776 TT_SYSTEM_ID=sim TT_SMSC_PASSWORD=sim JASMIN_PASSWORD=Zx9jasminpass01 CALLBACK_SECRET=Zx9-callback-secret-very-long-0123 \
          APP_URL=http://host.vasapp.local:18090 JCLI_HOST=127.0.0.1 JCLI_PORT=8990 JCLI_USER=jcliadmin JCLI_PASSWORD=jclipwd infra/jasmin/provision.sh
      - name: Démarrer l'application (profil pro)
        run: |
          HASH=$(java -Dloader.main=tn.vas.tools.HashPassword -cp target/vas-platform-1.0.0.jar org.springframework.boot.loader.launch.PropertiesLauncher 'Admin-Real-Pass-42')
          SPRING_PROFILES_ACTIVE=pro DB_URL=jdbc:postgresql://localhost:5433/vas DB_USER=vas DB_PASSWORD=Zx9-db-real-password RABBIT_HOST=localhost RABBIT_USER=guest RABBIT_PASSWORD=guest \
          REDIS_HOST=localhost REDIS_PORT=6380 VAS_PUBLIC_BASE_URL=http://host.vasapp.local:18090 DATA_KEY=Zx9-data-key-integration-0123456789abcdefghijklmnop TOKEN_SECRET=Zx9-token-secret-very-long-random-0123456789 JASMIN_URL=http://127.0.0.1:1401 \
          JASMIN_PASSWORD=Zx9jasminpass01 CALLBACK_SECRET=Zx9-callback-secret-very-long-0123 ADMIN_PASSWORD_HASH="$HASH" TT_MSISDN_PREFIXES="9,4" TT_SHORT_CODES="85500" \
          nohup java -jar target/vas-platform-1.0.0.jar --server.port=18090 > app.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:18090/auth/env && break; sleep 3; done
      - run: BASE=http://localhost:18090 SIM=http://localhost:8081 ADMIN_USER=admin ADMIN_PASSWORD=Admin-Real-Pass-42 node tests/integration/full-stack.mjs
      - if: failure()
        run: tail -100 app.log; docker compose -f docker-compose.it.yml logs jasmin | tail -100
  ui-e2e:
    # Parcours navigateur (Chromium) et audit d'accessibilité axe-core sur l'application réelle en profil dev
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run build && npx playwright-core install --with-deps chromium
      - run: mvn -B -DskipTests package
      - name: Accessibilité (WCAG 2.1 A/AA)
        run: |
          SPRING_PROFILES_ACTIVE=dev nohup java -jar target/vas-platform-1.0.0.jar --server.port=18083 > app-a11y.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:18083/auth/env && break; sleep 3; done; sleep 6
          cd frontend && BASE=http://localhost:18083 node e2e/a11y.mjs
      - name: Parcours de bout en bout (MFA imposé)
        run: |
          pkill -f 'server.port=18083' || true; sleep 3
          VAS_MFA_ENFORCED=true SPRING_PROFILES_ACTIVE=dev nohup java -jar target/vas-platform-1.0.0.jar --server.port=18083 > app-e2e.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:18083/auth/env && break; sleep 3; done; sleep 6
          cd frontend && BASE=http://localhost:18083 ADMIN_USER=admin ADMIN_PASSWORD=Admin-dev-pass1 node e2e/smoke.mjs
      - if: failure()
        run: tail -80 app-a11y.log app-e2e.log
