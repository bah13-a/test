name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build & tests (unitaires, intégration H2, simulateur SMPP)
        run: mvn -B verify
      - name: Analyse des dépendances vulnérables
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9 -DskipTests
        continue-on-error: true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm test && npm run build
      - run: cd frontend && npm audit --omit=dev --audit-level=high
        continue-on-error: true
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vas-platform:ci .
