# Configuration COMMUNE. Les profils portent le reste :
#   dev  -> mocks (H2, simulateur de gateway, file mémoire, données de démonstration)      : application-dev.yml
#   pro  -> données réelles (PostgreSQL, RabbitMQ, Redis, Jasmin, secrets obligatoires)     : application-pro.yml
#   test -> tests automatisés (src/test/resources)
# Sans profil valide, l'application refuse de démarrer (ProfileGuard) : jamais de mock par accident en production.
spring:
  application:
    name: vas-platform
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

vas:
  mo-dedup-seconds: 30
  retry:
    max-attempts: 5
    backoff-seconds: 30
