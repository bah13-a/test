<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAS Back-office</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --accent:#0b5fff; --muted:#667085; --line:#e4e7ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --fg:#e6e8eb; --card:#1b2027; --muted:#98a2b3; --line:#2b323b; } }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  nav button { background:none; border:0; padding:6px 10px; cursor:pointer; color:var(--muted); font:inherit; border-radius:6px; }
  nav button.on { background:var(--accent); color:#fff; }
  main { padding:16px; max-width:1200px; margin:auto; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--muted); font-weight:600; }
  input { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .login { display:flex; gap:8px; margin-left:auto; }
  .err { color:#d92d20; } .muted { color:var(--muted); }
  .tbl { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <h1>Plateforme VAS</h1>
  <nav id="nav"></nav>
  <form class="login" id="login"><input id="u" placeholder="utilisateur" autocomplete="username"><input id="p" type="password" placeholder="mot de passe" autocomplete="current-password"><button>Connexion</button></form>
</header>
<main><div id="msg" class="muted">Connectez-vous pour afficher les données.</div><div class="tbl" id="out"></div></main>
<script src="app.js"></script>
</body>
</html>
