# Profil DEV sans Docker : H2 en mémoire, simulateur de gateway, file en mémoire. NE JAMAIS utiliser en production.
spring:
  datasource:
    url: jdbc:h2:mem:vasdev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
management:
  health:
    redis: { enabled: false }
    rabbit: { enabled: false }
vas:
  queue: memory
  rate-limit: memory
  token-secret: dev-token-secret-0123456789abcdef
  mfa-enforced: false
  public-base-url: http://localhost:8080
  jasmin: { simulator: true, password: dev }
  callback: { shared-secret: dev-secret }
  retry: { max-attempts: 3, backoff-seconds: 10 }
  admin-users:
    - username: admin
      password-hash: "{noop}Admin-dev-pass1"
      roles: [SUPER_ADMIN]
