spring:
  datasource:
    url: jdbc:h2:mem:vas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
vas:
  queue: memory
  rate-limit: memory
  public-base-url: http://localhost
  mo-dedup-seconds: 30
  data-key: test-data-key-0123456789abcdef0123456789abcdef
  token-secret: test-token-secret-0123456789abcdef
  mfa-enforced: false
  jasmin:
    simulator: true
  callback:
    shared-secret: test-secret
  retry:
    max-attempts: 3
    backoff-seconds: 0
