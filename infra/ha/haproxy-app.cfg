global
  maxconn 2000
defaults
  mode http
  timeout connect 3s
  timeout client 60s
  timeout server 60s
frontend web
  bind *:8080
  default_backend vas
backend vas
  option httpchk GET /actuator/health/readiness
  http-check expect status 200
  balance roundrobin
  server-template app 2 app:8080 check resolvers docker init-addr none
resolvers docker
  nameserver dns 127.0.0.11:53
